name: Fetch post images

on:
  push:
    paths:
      - "**/urls.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files listed in urls.txt
        run: |
          set -e
          for list in $(git ls-files '**/urls.txt' 'urls.txt'); do
            dir=$(dirname "$list")
            while IFS='|' read -r name url; do
              [ -z "$name" ] && continue
              echo "Downloading $dir/$name"
              curl -fsSL --retry 3 -o "$dir/$name" "$url"
            done < "$list"
            git rm -q --cached "$list" || true
            rm -f "$list"
          done
          ls -la */ || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add post images" || echo "Nothing to commit"
          git push
